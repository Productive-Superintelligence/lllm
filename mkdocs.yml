site_name: LLLM
site_description: Low-Level Language Models. A lightweight framework for advanced agentic systems.
site_url: https://lllm.one/
repo_name: Productive-Superintelligence/lllm
repo_url: https://github.com/Productive-Superintelligence/lllm
edit_uri: edit/main/docs/
copyright: '<a class="psi-footer-brand" href="https://lllm.one/"><span class="psi-footer-wordmark" aria-hidden="true"></span><span class="psi-footer-text">LLLM</span></a>'

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: Newsreader
    code: Space Mono
  palette:
    - scheme: default
      primary: white
      accent: black
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - search.highlight

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            show_if_no_docstring: false
            filters: ["!^_"]
            heading_level: 2

hooks:
  - scripts/docs_hooks.py

nav:
  - Get started:
      - Introduction: index.md
      - Installation: install.md
      - How LLLM works: concepts.md
  - Guide:
      - Core concepts:
          - Agents: agents.md
          - Prompts: prompts.md
          - Tools: tools.md
          - Dialogs: dialogs.md
          - Tactics: tactics.md
          - Typed I/O: typed-io.md
          - Configuration: configuration.md
          - Streaming: streaming.md
      - Models:
          - Models and providers: models.md
          - Inference hints: inference-hints.md
      - Capabilities:
          - Proxies: proxies.md
          - Sandbox: sandbox.md
  - Production:
      - Serving: serving.md
      - Testing: testing.md
      - Observability: observability.md
      - Packages: packages.md
      - The hub: publishing.md
  - Integrations:
      - Pydantic AI: pydantic-ai.md
      - Other runtimes: runtimes.md
  - Examples:
      - examples/index.md
  - API reference:
      - api/index.md
      - Native runtime: api/native.md
      - Protocol: api/protocol.md
      - Services: api/services.md
      - lllm.hub: api/hub.md
      - Proxies and sandbox: api/capabilities.md
      - lllm.testing: api/testing.md
      - CLI: api/cli.md
      - Service API: api/service-api.md
      - Hub metadata: api/hub-metadata.md

extra:
  generator: false
  homepage: https://lllm.one/
  current_doc: lllm
  docs_switch:
    - key: lllm
      title: LLLM
      url: https://lllm.one/
    - key: sssn
      title: SSSN
      url: https://sssn.one/
    - key: aaax
      title: AAAX
      url: https://aaax.one/
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Productive-Superintelligence/lllm

extra_css:
  - stylesheets/custom.20260702.css

extra_javascript:
  - javascripts/vendor/mermaid.min.js
  - javascripts/mermaid-init.20260629.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.tabbed:
      alternate_style: true
