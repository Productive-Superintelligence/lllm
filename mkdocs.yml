site_name: LLLM
site_description: Protocol and service layer for reusable agentic tactics.
site_url: https://lllm.one/
repo_name: Productive-Superintelligence/lllm
repo_url: https://github.com/Productive-Superintelligence/lllm
edit_uri: edit/main/docs/
copyright: '<a class="psi-footer-brand" href="https://lllm.one/"><span class="psi-footer-wordmark" aria-hidden="true"></span><span class="psi-footer-text">LLLM</span></a>'

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: Newsreader
    code: Space Mono
  palette:
    - scheme: default
      primary: white
      accent: black
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.instant
    - navigation.top
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight

nav:
  - Overview:
      - Overview: index.md
      - Getting Started: getting-started.md
      - Concepts:
          - Tactics: concepts/tactics.md
          - Services: concepts/services.md
          - Packages: concepts/packages.md
          - Runtime Boundary: concepts/runtime-boundary.md
  - Tactic:
      - Tactic: protocol/index.md
      - Tactic Boundary: protocol/tactic-boundary.md
      - Service Boundary: protocol/service-boundary.md
      - Package Contract: protocol/package-contract.md
      - Refs And Resolution: protocol/refs-resolution.md
      - Composition: guides/composition.md
  - Runtime:
      - Runtime: runtime/index.md
      - Pydantic AI: runtime/pydantic-ai.md
      - Native Runtime:
          - Overview: runtime/native.md
          - Core Primitives:
              - Prompt And Dialog: runtime/native/prompt-dialog.md
              - Parsers And Tools: runtime/native/parsers-tools.md
          - Agent Runtime:
              - Agent Loop: runtime/native/agent-loop.md
              - Registry And Invokers: runtime/native/registry-invokers.md
          - Tactics:
              - Native Tactics: runtime/native/tactics.md
              - Protocol Adapter: runtime/native/adapter.md
          - Surroundings:
              - Proxies, Skills, And Sandbox: runtime/native/proxies-skills-sandbox.md
              - Boundary And Verification: runtime/native/boundary-verification.md
      - Plain Python: runtime/python.md
  - Tutorials:
      - Tactic Level:
          - First Tactic: tutorials/first-tactic.md
          - Proxies: tutorials/proxies.md
          - Sandboxes: tutorials/sandboxes.md
      - Runtime:
          - Pydantic AI Runtime: tutorials/pydantic-ai-runtime.md
          - Native Core: tutorials/native-core.md
          - Parsers: tutorials/parsers.md
  - Reference:
      - Protocol API: reference/protocol.md
      - Service API: reference/service-api.md
      - Native Preservation Audit: reference/native-preservation.md
      - CLI: reference/cli.md
      - PsiHub Metadata: reference/psihub-metadata.md

extra:
  generator: false
  homepage: https://lllm.one/
  current_doc: lllm
  docs_switch:
    - key: lllm
      title: LLLM
      url: https://lllm.one/
    - key: sssn
      title: SSSN
      url: https://sssn.one/
    - key: aaax
      title: AAAX
      url: https://aaax.one/
    - key: psihub
      title: PsiHub
      url: https://prosi.io/docs/hub/
    - key: psicli
      title: PSI CLI
      url: https://prosi.io/docs/cli/
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Productive-Superintelligence/lllm

extra_css:
  - stylesheets/custom.20260629.css

extra_javascript:
  - javascripts/vendor/mermaid.min.js
  - javascripts/mermaid-init.20260629.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.tabbed:
      alternate_style: true
