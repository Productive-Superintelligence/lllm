site_name: LLLM
site_description: Low-Level Language Models. A lightweight framework for advanced agentic systems.
site_url: https://lllm.one/
repo_name: Productive-Superintelligence/lllm
repo_url: https://github.com/Productive-Superintelligence/lllm
edit_uri: edit/main/docs/
copyright: '<a class="psi-footer-brand" href="https://lllm.one/"><span class="psi-footer-wordmark" aria-hidden="true"></span><span class="psi-footer-text">LLLM</span></a>'

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: Newsreader
    code: Space Mono
  palette:
    - scheme: default
      primary: white
      accent: black
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight

nav:
  - Home:
      - Overview: index.md
      - Getting Started: getting-started.md
  - Tutorials:
      - tutorials/index.md
      - 1. Quick Start: tutorials/01-quick-start.md
      - 2. Agents and Dialogs: tutorials/02-agents-and-dialogs.md
      - 3. Prompts and Structured Output: tutorials/03-prompts.md
      - 4. Tools, Proxies, and Sandbox: tutorials/04-tools.md
      - 5. Native Tactics: tutorials/05-native-tactics.md
      - 6. Packages and the Hub: tutorials/06-packages-and-hub.md
      - 7. Logging and Cost Tracking: tutorials/07-logging.md
      - 8. Advanced Patterns: tutorials/08-advanced-patterns.md
      - 9. Serving and Composition: tutorials/09-serving.md
      - 10. Pydantic AI Agents: tutorials/10-pydantic-ai.md
      - 11. Channels with SSSN: tutorials/11-channels.md
  - Native Runtime:
      - Architecture: core/architecture.md
      - Agent: core/agent.md
      - Prompts: core/prompts.md
      - Dialogs: core/dialog.md
      - Tactics: core/tactic.md
      - Configs: core/config.md
      - Invokers: core/invokers.md
      - Inference Hints: core/inference-hints.md
      - Proxies and Sandbox: core/proxy-and-sandbox.md
      - Logging: core/logging.md
      - Runtime: core/runtime.md
  - Tactic Protocol:
      - The Tactic: protocol/tactic.md
      - Runtimes: protocol/runtimes.md
      - Services: protocol/services.md
      - Refs and Composition: protocol/refs.md
  - Packages:
      - The Manifest: packages/manifest.md
      - Discovery: packages/discovery.md
      - The Hub: packages/hub.md
  - SSSN:
      - sssn/index.md
      - Channels: sssn/channels.md
      - Tactic Processing: sssn/processing.md
      - Serving and Refs: sssn/serving.md
  - AAAX:
      - aaax/index.md
  - Reference:
      - CLI: reference/cli.md
      - Service API: reference/service-api.md
      - Hub Metadata: reference/hub-metadata.md

extra:
  generator: false
  homepage: https://lllm.one/
  current_doc: lllm
  docs_switch:
    - key: lllm
      title: LLLM
      url: /
    - key: hub
      title: Hub
      url: /hub/
    - key: sssn
      title: SSSN
      url: /sssn/
    - key: aaax
      title: AAAX
      url: /aaax/
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Productive-Superintelligence/lllm

extra_css:
  - stylesheets/custom.20260702.css

extra_javascript:
  - javascripts/vendor/mermaid.min.js
  - javascripts/mermaid-init.20260629.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.tabbed:
      alternate_style: true
