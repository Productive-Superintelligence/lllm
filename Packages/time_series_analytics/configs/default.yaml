tactic_type: time_series_analysis

global:
  # Amazon Bedrock model (via LiteLLM). Newer Anthropic models are only available
  # as cross-region inference profiles (the "us."-prefixed ids). Adjust per
  # account/region; list options with `aws bedrock list-inference-profiles`.
  model_name: bedrock/us.anthropic.claude-haiku-4-5-20251001-v1:0
  model_args:
    temperature: 0.2

agent_configs:
  - name: profiler
    system_prompt_path: time_series_analytics:system/profiler
    model_args:
      temperature: 0.25

  - name: forecaster
    system_prompt_path: time_series_analytics:system/forecaster
    model_args:
      temperature: 0.2

  - name: synthesizer
    system_prompt_path: time_series_analytics:system/synthesizer
    model_args:
      temperature: 0.1
