[project]
name = "{{pyproject_name}}"
version = "0.1.0"
description = "{{project_title}} multi-agent pipeline built with LLLM."
requires-python = ">=3.10"
dependencies = [
    "lllm-core[native]>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
