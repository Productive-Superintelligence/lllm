[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lllm-core"
version = "0.2.1"
description = "Protocol and service layer for reusable agentic tactics."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.7",
    "tomli>=2.0; python_version<'3.11'",
]

[project.optional-dependencies]
client = ["httpx>=0.27"]
server = ["fastapi>=0.115", "uvicorn>=0.30"]
pydantic-ai = ["pydantic-ai"]
native = [
    "litellm>=1.82.3",
    "requests>=2.31.0",
    "filelock>=3.13.0",
    "Pillow>=10.0.0",
]
sandbox = [
    "nbformat>=5.10.0",
    "jupyter-client>=8.6.0",
]
tools = [
    "openai>=1.40.0",
    "tqdm>=4.66.0",
    "playwright>=1.45.0",
]
docs = ["mkdocs-material>=9.5"]
dev = [
    "pytest>=8.0",
    "build>=1.2",
    "twine>=5.1",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
all = [
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic-ai",
    "litellm>=1.82.3",
    "requests>=2.31.0",
    "filelock>=3.13.0",
    "Pillow>=10.0.0",
    "nbformat>=5.10.0",
    "jupyter-client>=8.6.0",
    "openai>=1.40.0",
    "tqdm>=4.66.0",
    "playwright>=1.45.0",
]

[project.scripts]
lllm = "lllm.cli:main"

[project.urls]
Homepage = "https://github.com/Productive-Superintelligence/lllm"
Source = "https://github.com/Productive-Superintelligence/lllm"
Issues = "https://github.com/Productive-Superintelligence/lllm/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["lllm*"]

[tool.setuptools.package-data]
lllm = ["py.typed"]
"lllm.runtimes.native.proxies.builtin" = ["*.json", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: opt-in tests that contact external provider APIs",
]
