[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lllm-core"
version = "0.4.0"
description = "Protocol and service layer for reusable agentic tactics."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.7",
    "tomli>=2.0; python_version<'3.11'",
]

[project.optional-dependencies]
client = ["httpx>=0.27"]
server = ["fastapi>=0.115", "uvicorn>=0.30"]
pydantic-ai = ["pydantic-ai"]
native = [
    "litellm>=1.82.3",
    "PyYAML>=6.0",
    "requests>=2.31.0",
    "filelock>=3.13.0",
    "Pillow>=10.0.0",
]
sandbox = [
    "nbformat>=5.10.0",
    "jupyter-client>=8.6.0",
    "ipykernel>=6.29",
]
tools = [
    "openai>=1.40.0",
    "tqdm>=4.66.0",
    "playwright>=1.45.0",
]
secure = ["keyring>=25.0"]
network = ["sssn>=0.2"]
shell = ["aaax>=0.3"]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    # pymdown-extensions 12.2 needs mkdocstrings 1.0.8, which needs Python 3.11.
    "pymdown-extensions<12.2; python_version < '3.11'",
]
dev = [
    "pytest>=8.0",
    "pytest-examples>=0.0.15",
    "build>=1.2",
    "twine>=5.1",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
all = [
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic-ai",
    "litellm>=1.82.3",
    "PyYAML>=6.0",
    "requests>=2.31.0",
    "filelock>=3.13.0",
    "Pillow>=10.0.0",
    "nbformat>=5.10.0",
    "jupyter-client>=8.6.0",
    "ipykernel>=6.29",
    "openai>=1.40.0",
    "tqdm>=4.66.0",
    "playwright>=1.45.0",
    "keyring>=25.0",
    "sssn>=0.2",
    "aaax>=0.3",
]

[project.scripts]
lllm = "lllm.cli:main"

[project.urls]
Homepage = "https://github.com/Productive-Superintelligence/lllm"
Source = "https://github.com/Productive-Superintelligence/lllm"
Issues = "https://github.com/Productive-Superintelligence/lllm/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["lllm*"]

[tool.setuptools.package-data]
lllm = ["py.typed", "templates/**/*", "templates/**/.*"]
"lllm.runtimes.native.proxies.builtin" = ["*.json", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: opt-in tests that contact external provider APIs",
]
