[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lllm"
version = "0.1.0"
description = "Protocol-first service layer for reusable agentic tactics."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn>=0.30"]
pydantic-ai = ["pydantic-ai"]
native = []
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
all = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic-ai",
]

[project.scripts]
lllm = "lllm.cli:main"

[project.urls]
Homepage = "https://github.com/Productive-Superintelligence/lllm"
Source = "https://github.com/Productive-Superintelligence/lllm"
Issues = "https://github.com/Productive-Superintelligence/lllm/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["lllm*"]

[tool.setuptools.package-data]
lllm = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
